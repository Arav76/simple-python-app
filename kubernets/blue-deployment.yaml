apiVersion: apps/v1
kind: Deployment

metadata:
  name: app-blue

spec:
  replicas: 2

  selector:
    matchLabels:
      app: sample
      version: blue

  template:
    metadata:
      labels:
        app: sample
        version: blue

    spec:
      containers:
      - name: app
        image: arav76/sample-python-app:v1

        ports:
        - containerPort: 5000
